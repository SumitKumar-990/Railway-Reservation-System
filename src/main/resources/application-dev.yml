spring:
  datasource:
    url: jdbc:h2:mem:railwaydb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  seed-data: true

logging:
  level:
    com.railway: DEBUG
